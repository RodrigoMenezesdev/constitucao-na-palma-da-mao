<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constituição na Palma da Mão</title>

    <!-- Ícone para navegadores e celulares -->
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192x192.png">
    <link rel="apple-touch-icon" href="icon-512x512.png">

    <!-- Configurações para PWA -->
    <link rel="manifest" href="data:application/json,{%22name%22:%22Constituição%20na%20Palma%20da%20Mão%22,%22short_name%22:%22Constituição%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%231e3a8a%22,%22theme_color%22:%22%231e3a8a%22,%22icons%22:[{%22src%22:%22icon-192x192.png%22,%22sizes%22:%22192x192%22,%22type%22:%22image/png%22},{%22src%22:%22icon-512x512.png%22,%22sizes%22:%22512x512%22,%22type%22:%22image/png%22}]}">
    <meta name="theme-color" content="#1e3a8a">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MarkedJS -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans p-4 md:p-6">

    <!-- Tela de Capa / Splash Screen -->
    <div id="splashScreen" class="fixed inset-0 bg-blue-900 flex justify-center items-center z-50 transition-opacity duration-700">
        <div class="w-72 h-72 md:w-96 md:h-96 overflow-hidden rounded-3xl shadow-2xl border-2 border-amber-400/30 flex items-center justify-center animate-pulse">
            <img src="icon-512x512.png" alt="Constituição na Palma da Mão" class="w-full h-full object-cover">
        </div>
    </div>

    <main class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        <!-- Cabeçalho -->
        <header class="bg-blue-900 text-white p-6 text-center">
            <h1 class="text-2xl font-bold">📜 Constituição na Palma da Mão</h1>
            <p class="text-blue-200 text-sm mt-1">
                Conheça e exerça seus direitos de forma simples
            </p>
            <style>
                #resultado pre, #resultado code {
                    white-space: pre-wrap !important;
                    word-break: break-word !important;
                    overflow-x: auto;
                }
            </style>
        </header>

        <!-- Formulário do Usuário -->
        <section class="p-6 space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-1 text-slate-700">1. Selecione o Tema:</label>
                <select id="tema" class="w-full p-3 border border-slate-300 rounded-xl bg-slate-50 focus:ring-2 focus:ring-blue-600 outline-none">
                    <option value="Saúde">Saúde (SUS, remédios, consultas)</option>
                    <option value="Educação">Educação (Escola, vagas, creche)</option>
                    <option value="Segurança">Segurança Pública</option>
                    <option value="Consumidor">Direito do Consumidor</option>
                    <option value="Trabalho">Direito do Trabalho / CLT</option>
                    <option value="Moradia">Moradia e Inquilinato</option>
                    <option value="Outros">Outros assuntos</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1 text-slate-700">2. Sua Cidade e Estado:</label>
                <input type="text" id="localizacao" placeholder="Ex: Rio de Janeiro / RJ" class="w-full p-3 border border-slate-300 rounded-xl bg-slate-50 focus:ring-2 focus:ring-blue-600 outline-none">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1 text-slate-700">3. Relate o seu problema:</label>
                <div class="relative">
                    <textarea id="problema" rows="4" placeholder="Descreva o que aconteceu ou clique no microfone para falar..." class="w-full p-3 pr-12 border border-slate-300 rounded-xl bg-slate-50 focus:ring-2 focus:ring-blue-600 outline-none"></textarea>
                    <!-- Botão de Microfone -->
                    <button type="button" onclick="alternarGravacao()" id="btnGravacao" class="absolute right-3 bottom-3 p-2 bg-slate-200 hover:bg-slate-300 rounded-full transition duration-200 text-slate-700" title="Falar por áudio">
                        🎙️
                    </button>
                </div>
                <p id="statusGravacao" class="text-xs text-blue-600 mt-1 hidden animate-pulse">
                    🔴 Ouvindo... Pode falar agora.
                </p>
            </div>

            <button onclick="consultarDireitos()" id="btnConsultar" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition duration-200 flex justify-center items-center gap-2">
                <span>Consultar Meus Direitos</span>
            </button>
        </section>

        <!-- Área de Exibição de Resultados -->
        <section id="resultado" class="hidden p-6 border-t border-slate-200 bg-slate-50 text-slate-900 leading-relaxed space-y-4 break-words overflow-hidden">
        </section>
    </main>

    <script>
        // ==========================================
        // ESCONDER A TELA DE CAPA (SPLASH SCREEN)
        // ==========================================
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splashScreen');
                if (splash) {
                    splash.classList.add('opacity-0');
                    setTimeout(() => splash.style.display = 'none', 700);
                }
            }, 2500);
        });

        // ==========================================
        // CONFIGURAÇÕES DA API E INSTRUÇÕES
        // ==========================================
        const SYSTEM_INSTRUCTIONS = `Você é o assistente virtual do aplicativo "Constituição na Palma da Mão", um especialista em legislação brasileira.
        Estruture a resposta estritamente nas 5 seções Markdown:
        🟢 1. Diagnóstico e Acolhimento
        📜 2. O Que a Lei Diz (Sem "Juridiquês")
        👣 3. Passo a Passo Prático
        📞 4. Contatos Úteis e Acesso à Justiça Local (Use a localização informada para direcionar Procon/Defensoria)
        📄 5. Modelo de Requerimento / Carta Pronta
        Mantenha o tom empático e termine com nota legal informativa.`;

        // ==========================================
        // LÓGICA DO MICROFONE (DITADO POR VOZ)
        // ==========================================
        let reconhecimentoVoz = null;
        let gravando = false;

        if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            reconhecimentoVoz = new SpeechRecognition();
            reconhecimentoVoz.lang = 'pt-BR';
            reconhecimentoVoz.continuous = false;
            reconhecimentoVoz.interimResults = false;

            reconhecimentoVoz.onresult = (event) => {
                const textoTranscrito = event.results[0][0].transcript;
                const campoProblema = document.getElementById('problema');

                if (campoProblema.value.trim() !== '') {
                    campoProblema.value += ' ' + textoTranscrito;
                } else {
                    campoProblema.value = textoTranscrito;
                }
            };

            reconhecimentoVoz.onend = () => {
                pararGravacaoVisual();
            };

            reconhecimentoVoz.onerror = (event) => {
                console.error("Erro no reconhecimento de voz:", event.error);
                pararGravacaoVisual();
            };
        }

        function alternarGravacao() {
            if (!reconhecimentoVoz) {
                alert("O seu navegador não suporta a função de ditado por voz.");
                return;
            }

            if (!gravando) {
                reconhecimentoVoz.start();
                gravando = true;
                const btn = document.getElementById('btnGravacao');
                btn.classList.add('bg-red-500', 'text-white');
                btn.classList.remove('bg-slate-200', 'text-slate-700');
                document.getElementById('statusGravacao').classList.remove('hidden');
            } else {
                reconhecimentoVoz.stop();
                pararGravacaoVisual();
            }
        }

        function pararGravacaoVisual() {
            gravando = false;
            const btn = document.getElementById('btnGravacao');
            if (btn) {
                btn.classList.remove('bg-red-500', 'text-white');
                btn.classList.add('bg-slate-200', 'text-slate-700');
            }
            const status = document.getElementById('statusGravacao');
            if (status) {
                status.classList.add('hidden');
            }
        }

        // ==========================================
        // LÓGICA DE CONSULTA À API DO GEMINI (VIA NETLIFY FUNCTION)
        // ==========================================
        async function consultarDireitos() {
            const tema = document.getElementById('tema').value;
            const localizacao = document.getElementById('localizacao').value || "Não informada";
            const problema = document.getElementById('problema').value.trim();
            const btn = document.getElementById('btnConsultar');
            const resultadoDiv = document.getElementById('resultado');

            if (!problema) {
                alert("Por favor, descreva o seu problema antes de consultar.");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<span class="animate-spin">🌀</span> Consultando Legislação...`;
            resultadoDiv.classList.add('hidden');

            const promptUsuario = `Tema: ${tema}\nLocalização: ${localizacao}\nProblema: ${problema}`;

            try {
                const response = await fetch('https://SEU-SITE.netlify.app/.netlify/functions/gemini', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        promptUsuario: promptUsuario,
                        systemInstructions: typeof SYSTEM_INSTRUCTIONS !== 'undefined' ? SYSTEM_INSTRUCTIONS : ""
                    })
                });

                const data = await response.json();

                // ✅ Como deve ficar (extrai a mensagem real do erro):
          if (!response.ok) {
             let mensagem = "Erro no servidor";
             if (typeof data.error === 'string') {
              mensagem = data.error;
              } else if (data.error && data.error.message) {
               mensagem = data.error.message;
               } else if (typeof data === 'object') {
               mensagem = JSON.stringify(data);
               }
               throw new Error(mensagem);
            }
                

                const textoResposta = data.candidates[0].content.parts[0].text;

                resultadoDiv.innerHTML = marked.parse(textoResposta);
                resultadoDiv.classList.remove('hidden');
                resultadoDiv.scrollIntoView({
                    behavior: 'smooth'
                });

            } catch (erro) {
                alert("Erro ao consultar: " + erro.message);
                console.error(erro);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<span>Consultar Meus Direitos</span>`;
            }
        }
    </script>

</body>
</html>
